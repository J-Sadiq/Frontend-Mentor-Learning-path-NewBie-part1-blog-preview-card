<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Blog Preview Card</title>
  </head>
  <body>
    <main>
      <article class="blog-card">
        <div class="top-box">
          <img
            src="assets/images/illustration-article.svg"
            alt="Blog Article"
          />
        </div>
        <div class="main-box">
          <div href="#" class="btn-learning">Learning</div>
          <p class="published">Published 18 Oct 2026</p>
          <a class="title" href="#">HTML & CSS Foundation</a>
          <p class="paragraph">
            These languages are the backbone of every website, defining
            structur, content, and presentation.
          </p>
        </div>
        <div class="bottom-box">
          <img src="assets/images/image-avatar.webp" alt="Writer" />
          <p class="writer-name">Greg Hooper</p>
        </div>
      </article>
    </main>
  </body>
</html>
